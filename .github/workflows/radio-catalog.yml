name: Refresh radio catalog

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Optional comma-separated country codes (for example CA,GB,US). Blank scans all."
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-radio-catalog.mjs"
      - ".github/workflows/radio-catalog.yml"

permissions:
  contents: write

concurrency:
  group: radio-catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout radio data branch
        uses: actions/checkout@v4
        with:
          ref: radio-catalog
          path: radio-catalog-data
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh and probe Radio Browser catalog
        env:
          RADIO_OUTPUT_DIR: ${{ github.workspace }}/radio-catalog-data
          RADIO_COUNTRIES: ${{ github.event.inputs.countries || '' }}
          RADIO_FETCH_CONCURRENCY: "3"
          RADIO_PROBE_CONCURRENCY: "8"
          RADIO_REQUEST_TIMEOUT_MS: "20000"
          RADIO_PROBE_TIMEOUT_MS: "8000"
        run: node scripts/update-radio-catalog.mjs

      - name: Commit radio catalog branch
        working-directory: radio-catalog-data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Radio catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json '[A-Z][A-Z]/active.json' '[A-Z][A-Z]/dead.json'
          git commit -m "chore(radio-catalog): daily station health refresh"
          git push origin HEAD:radio-catalog
