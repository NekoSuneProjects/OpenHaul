name: Build SCS telemetry plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/scs/**"
      - "clients/windows/OpenHaul.Client/Models.cs"
      - "clients/windows/OpenHaul.Client/TelemetryService.cs"
      - ".github/workflows/scs-plugin.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/scs/**"
      - "clients/windows/OpenHaul.Client/Models.cs"
      - "clients/windows/OpenHaul.Client/TelemetryService.cs"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: openhaul-scs-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official SCS Telemetry SDK 1.15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.eurotrucksimulator2.com/scs_sdk_1_15.zip" -OutFile "$env:RUNNER_TEMP\scs_sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\scs_sdk.zip" "$env:RUNNER_TEMP\scs_sdk"
          $header = Get-ChildItem "$env:RUNNER_TEMP\scs_sdk" -Recurse -Filter "scssdk_telemetry.h" | Select-Object -First 1
          if (-not $header) { throw "scssdk_telemetry.h was not found in the official SDK archive." }
          "SCS_SDK_INCLUDE=$($header.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set plugin version
        shell: pwsh
        run: |
          "OPENHAUL_TELEMETRY_VERSION=1.0.${{ github.run_number }}.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake -S plugins/scs -B build/scs -A x64 -DSCS_SDK_INCLUDE="$env:SCS_SDK_INCLUDE"

      - name: Build
        run: cmake --build build/scs --config Release

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\scs-plugin | Out-Null
          $dll = Get-ChildItem build\scs -Recurse -Filter "OpenHaul.Telemetry.dll" | Select-Object -First 1
          if (-not $dll) { throw "OpenHaul.Telemetry.dll was not produced." }
          Copy-Item $dll.FullName artifacts\scs-plugin\OpenHaul.Telemetry.dll
          $sha = (Get-FileHash "artifacts\scs-plugin\OpenHaul.Telemetry.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            schemaVersion = 1
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            telemetry = @{
              version = $env:OPENHAUL_TELEMETRY_VERSION
              url = "https://github.com/${{ github.repository }}/releases/download/scs-plugin/OpenHaul.Telemetry.dll"
              sha256 = $sha
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File artifacts\scs-plugin\telemetry-manifest.json -Encoding utf8

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign telemetry release with Sigstore
        shell: pwsh
        run: |
          cosign sign-blob --yes --bundle artifacts/scs-plugin/OpenHaul.Telemetry.dll.sigstore.json artifacts/scs-plugin/OpenHaul.Telemetry.dll
          cosign sign-blob --yes --bundle artifacts/scs-plugin/telemetry-manifest.json.sigstore.json artifacts/scs-plugin/telemetry-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaul-SCS-Telemetry-win-x64
          path: |
            artifacts/scs-plugin/OpenHaul.Telemetry.dll
            artifacts/scs-plugin/telemetry-manifest.json
            artifacts/scs-plugin/OpenHaul.Telemetry.dll.sigstore.json
            artifacts/scs-plugin/telemetry-manifest.json.sigstore.json

      - name: Publish rolling telemetry release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view scs-plugin --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create scs-plugin --repo "${{ github.repository }}" --title "OpenHaul SCS Telemetry Plugin" --notes "Rolling SCS telemetry plugin release for OpenHaul." --latest=false
          }
          gh release upload scs-plugin artifacts/scs-plugin/OpenHaul.Telemetry.dll artifacts/scs-plugin/OpenHaul.Telemetry.dll.sigstore.json artifacts/scs-plugin/telemetry-manifest.json artifacts/scs-plugin/telemetry-manifest.json.sigstore.json --repo "${{ github.repository }}" --clobber
          gh release edit scs-plugin --repo "${{ github.repository }}" --draft=false --latest=false
