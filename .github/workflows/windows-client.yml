name: Build Windows client

on:
  push:
    branches: [main]
    paths:
      - "clients/windows/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore clients/windows/OpenHaul.Client/OpenHaul.Client.csproj

      - name: Build
        run: dotnet build clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release --no-restore

      - name: Publish portable client
        run: dotnet publish clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release -r win-x64 --self-contained false -o artifacts/OpenHaul.Client

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaul.Client-win-x64
          path: artifacts/OpenHaul.Client
