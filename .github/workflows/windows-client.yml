name: Build Windows client

on:
  push:
    branches: [main]
    paths:
      - "clients/windows/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/windows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openhaul-windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download latest released telemetry plugin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/OpenHaul.Client | Out-Null
          New-Item -ItemType Directory -Force artifacts/telemetry-release | Out-Null

          gh release download scs-plugin --repo "${{ github.repository }}" --pattern "OpenHaul.Telemetry.dll" --dir artifacts/OpenHaul.Client --clobber
          gh release download scs-plugin --repo "${{ github.repository }}" --pattern "telemetry-manifest.json" --dir artifacts/telemetry-release --clobber

          $manifest = Get-Content "artifacts/telemetry-release/telemetry-manifest.json" -Raw | ConvertFrom-Json
          $expected = [string]$manifest.telemetry.sha256
          $actual = (Get-FileHash "artifacts/OpenHaul.Client/OpenHaul.Telemetry.dll" -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected.ToLowerInvariant()) {
            throw "Downloaded telemetry DLL checksum does not match telemetry-manifest.json."
          }

          "OPENHAUL_TELEMETRY_VERSION=$($manifest.telemetry.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENHAUL_TELEMETRY_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore clients/windows/OpenHaul.Client/OpenHaul.Client.csproj

      - name: Set release version
        shell: pwsh
        run: |
          "OPENHAUL_CLIENT_VERSION=1.0.${{ github.run_number }}.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: dotnet build clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release --no-restore -p:Version=${{ env.OPENHAUL_CLIENT_VERSION }}

      - name: Publish self-contained GUI client
        shell: pwsh
        run: |
          dotnet publish clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:OPENHAUL_CLIENT_VERSION -o artifacts/OpenHaul.Client

      - name: Publish self-contained updater
        shell: pwsh
        run: |
          dotnet publish clients/windows/OpenHaul.Updater/OpenHaul.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:OPENHAUL_CLIENT_VERSION -o artifacts/OpenHaul.Updater

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:OPENHAUL_CLIENT_VERSION" "clients/windows/installer/OpenHaul.iss"
          if (-not (Test-Path "artifacts/installer/OpenHaul-Setup.exe")) { throw "OpenHaul-Setup.exe was not produced." }

      - name: Build update manifest
        shell: pwsh
        run: |
          $installer = (Get-FileHash "artifacts/installer/OpenHaul-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            schemaVersion = 1
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            client = @{
              version = $env:OPENHAUL_CLIENT_VERSION
              mandatory = $true
              installerUrl = "https://github.com/${{ github.repository }}/releases/download/windows-client/OpenHaul-Setup.exe"
              sha256 = $installer
            }
            telemetry = @{
              version = $env:OPENHAUL_TELEMETRY_VERSION
              url = "https://github.com/${{ github.repository }}/releases/download/scs-plugin/OpenHaul.Telemetry.dll"
              sha256 = $env:OPENHAUL_TELEMETRY_SHA256
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File artifacts/client-manifest.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaul-Setup-win-x64
          path: |
            artifacts/installer/OpenHaul-Setup.exe
            artifacts/client-manifest.json

      - name: Publish rolling Windows installer release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestMain = gh api "repos/${{ github.repository }}/commits/main" --jq ".sha"
          if ($latestMain -ne "${{ github.sha }}") {
            Write-Host "Skipping rolling release publish because this build is stale."
            Write-Host "Build SHA:  ${{ github.sha }}"
            Write-Host "Latest main: $latestMain"
            exit 0
          }

          gh release view windows-client --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-client --repo "${{ github.repository }}" --title "OpenHaul Windows Client" --notes "Rolling Windows GUI installer for OpenHaul Client." --latest=false
          }
          gh release upload windows-client artifacts/installer/OpenHaul-Setup.exe artifacts/client-manifest.json --repo "${{ github.repository }}" --clobber
          gh release edit windows-client --repo "${{ github.repository }}" --draft=false --latest=false
