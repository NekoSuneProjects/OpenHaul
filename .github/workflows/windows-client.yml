name: Build Windows client

on:
  push:
    branches: [main]
    paths:
      - "clients/windows/**"
      - "plugins/scs/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/windows/**"
      - "plugins/scs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download official SCS Telemetry SDK 1.15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.eurotrucksimulator2.com/scs_sdk_1_15.zip" -OutFile "$env:RUNNER_TEMP\scs_sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\scs_sdk.zip" "$env:RUNNER_TEMP\scs_sdk"
          $header = Get-ChildItem "$env:RUNNER_TEMP\scs_sdk" -Recurse -Filter "scssdk_telemetry.h" | Select-Object -First 1
          if (-not $header) { throw "scssdk_telemetry.h was not found in the official SDK archive." }
          "SCS_SDK_INCLUDE=$($header.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build telemetry plugin
        shell: pwsh
        run: |
          cmake -S plugins/scs -B build/scs -A x64 -DSCS_SDK_INCLUDE="$env:SCS_SDK_INCLUDE"
          cmake --build build/scs --config Release
          $dll = Get-ChildItem build/scs -Recurse -Filter "OpenHaul.Telemetry.dll" | Select-Object -First 1
          if (-not $dll) { throw "OpenHaul.Telemetry.dll was not produced." }
          New-Item -ItemType Directory -Force artifacts/OpenHaul.Client | Out-Null
          Copy-Item $dll.FullName artifacts/OpenHaul.Client/OpenHaul.Telemetry.dll

      - name: Restore
        run: dotnet restore clients/windows/OpenHaul.Client/OpenHaul.Client.csproj

      - name: Build
        run: dotnet build clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release --no-restore

      - name: Publish self-contained GUI client
        shell: pwsh
        run: |
          dotnet publish clients/windows/OpenHaul.Client/OpenHaul.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/OpenHaul.Client

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "clients/windows/installer/OpenHaul.iss"
          if (-not (Test-Path "artifacts/installer/OpenHaul-Setup.exe")) { throw "OpenHaul-Setup.exe was not produced." }

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaul-Setup-win-x64
          path: artifacts/installer/OpenHaul-Setup.exe

      - name: Publish rolling Windows installer release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-client --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-client --repo "${{ github.repository }}" --title "OpenHaul Windows Client" --notes "Rolling Windows GUI installer for OpenHaul Client." --latest=false
          }
          gh release upload windows-client artifacts/installer/OpenHaul-Setup.exe --repo "${{ github.repository }}" --clobber
          gh release edit windows-client --repo "${{ github.repository }}" --draft=false --latest=false
