services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhaul}
      POSTGRES_USER: ${POSTGRES_USER:-openhaul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openhaul} -d ${POSTGRES_DB:-openhaul}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openhaul:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_MAP_ROAD_TILE_URL: "${NEXT_PUBLIC_MAP_ROAD_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}"
        NEXT_PUBLIC_MAP_SATELLITE_TILE_URL: "${NEXT_PUBLIC_MAP_SATELLITE_TILE_URL:-https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}"
    image: ghcr.io/nekosuneprojects/openhaul:latest
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://openhaul:change-me@postgres:5432/openhaul}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OPENHAUL_INGEST_KEY: ${OPENHAUL_INGEST_KEY:-change-this-ingest-key}
      OPENHAUL_ADMIN_KEY: ${OPENHAUL_ADMIN_KEY:-change-this-admin-key}
      DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
      KOFI_URL: ${KOFI_URL:-}
      OPENHAUL_BOOTSTRAP_GOAL_TITLE: ${OPENHAUL_BOOTSTRAP_GOAL_TITLE:-}
      OPENHAUL_BOOTSTRAP_GOAL_DESCRIPTION: ${OPENHAUL_BOOTSTRAP_GOAL_DESCRIPTION:-}
      OPENHAUL_BOOTSTRAP_GOAL_CURRENCY: ${OPENHAUL_BOOTSTRAP_GOAL_CURRENCY:-GBP}
      OPENHAUL_BOOTSTRAP_GOAL_TARGET: ${OPENHAUL_BOOTSTRAP_GOAL_TARGET:-}
      OPENHAUL_BOOTSTRAP_GOAL_CURRENT: ${OPENHAUL_BOOTSTRAP_GOAL_CURRENT:-0}
      OPENHAUL_BOOTSTRAP_VTC_NAME: ${OPENHAUL_BOOTSTRAP_VTC_NAME:-}
      OPENHAUL_BOOTSTRAP_VTC_SLUG: ${OPENHAUL_BOOTSTRAP_VTC_SLUG:-}
      OPENHAUL_BOOTSTRAP_VTC_TAG: ${OPENHAUL_BOOTSTRAP_VTC_TAG:-}
      OPENHAUL_BOOTSTRAP_VTC_API_KEY: ${OPENHAUL_BOOTSTRAP_VTC_API_KEY:-}
      OPENHAUL_BOOTSTRAP_VTC_API_SCOPES: ${OPENHAUL_BOOTSTRAP_VTC_API_SCOPES:-telemetry:read,jobs:read,fines:read}
      TRUCKERSFM_NOWPLAYING_URL: ${TRUCKERSFM_NOWPLAYING_URL:-https://azuracast.truckers.fm/api/nowplaying/1}
      NEKOROUTE_API_URL: ${NEKOROUTE_API_URL:-https://proxyweb.nekosunevr.co.uk}
      RADIO_CHSL_SOURCE_URL: ${RADIO_CHSL_SOURCE_URL:-https://stingray.leanstream.co/CHSLFM?args=web_01&aw_0_req.gdpr=true&gdpr=true}
      RADIO_CHSL_BITRATE_KBPS: ${RADIO_CHSL_BITRATE_KBPS:-128}
      RADIO_FFMPEG_PROBESIZE: ${RADIO_FFMPEG_PROBESIZE:-65536}
      RADIO_FFMPEG_ANALYZEDURATION_US: ${RADIO_FFMPEG_ANALYZEDURATION_US:-250000}
      RADIO_FFMPEG_RW_TIMEOUT_US: ${RADIO_FFMPEG_RW_TIMEOUT_US:-8000000}
      RADIO_PROXY_ALLOW_DIRECT_FALLBACK: ${RADIO_PROXY_ALLOW_DIRECT_FALLBACK:-true}
      RADIO_PROXY_STATIONS_JSON: "${RADIO_PROXY_STATIONS_JSON:-[]}"
      RADIO_BROWSER_API_URL: ${RADIO_BROWSER_API_URL:-https://de1.api.radio-browser.info}
      RADIO_BROWSER_API_URLS: ${RADIO_BROWSER_API_URLS:-}
      INTERNET_RADIO_DIRECTORY_URL: ${INTERNET_RADIO_DIRECTORY_URL:-https://www.internet-radio.com}
      XIPH_DIRECTORY_URL: ${XIPH_DIRECTORY_URL:-https://dir.xiph.org}
      LAUTFM_API_URL: ${LAUTFM_API_URL:-https://api.laut.fm}
      SHOUTCAST_API_URL: ${SHOUTCAST_API_URL:-https://api.shoutcast.com}
      SHOUTCAST_API_KEY: ${SHOUTCAST_API_KEY:-}
      RADIO_GEO_PROBE_COUNTRIES: ${RADIO_GEO_PROBE_COUNTRIES:-GB,CA,US,DE,FR,NL,AU,NZ}
      RADIO_FORCE_PROXY_COUNTRIES: ${RADIO_FORCE_PROXY_COUNTRIES:-CA,GB}
      RADIO_GEO_RULES_JSON: "${RADIO_GEO_RULES_JSON:-[]}"
      RADIO_URL_GEO_RULES_JSON: "${RADIO_URL_GEO_RULES_JSON:-[]}"
      RADIO_RELAY_SIGNING_SECRET: ${RADIO_RELAY_SIGNING_SECRET:-}
      OPENHAUL_MAP_DATA_DIR: /data-runtime/maps
      OPENHAUL_MAP_AUTO_UPDATE: ${OPENHAUL_MAP_AUTO_UPDATE:-true}
      OPENHAUL_MAP_MANIFEST_URL: ${OPENHAUL_MAP_MANIFEST_URL:-https://github.com/NekoSuneProjects/OpenHaul/releases/download/map-data/maps.json}
      OPENHAUL_MAP_UPDATE_HOURS: ${OPENHAUL_MAP_UPDATE_HOURS:-6}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      OPENHAUL_PUBLIC_API_URL: ${OPENHAUL_PUBLIC_API_URL:-http://localhost:3000}
      OPENHAUL_STEAM_REALM: ${OPENHAUL_STEAM_REALM:-http://localhost:3000/}
      OPENHAUL_COOKIE_SECURE: ${OPENHAUL_COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      OPENHAUL_BOT_SERVICE_KEY: ${OPENHAUL_BOT_SERVICE_KEY:-}
    volumes:
      - ./data-runtime:/data-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${OPENHAUL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: ghcr.io/nekosuneprojects/openhaul-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      OPENHAUL_API_URL: http://openhaul:3000
      OPENHAUL_APP_URL: ${APP_URL:-http://localhost:3000}
      OPENHAUL_BOT_SERVICE_KEY: ${OPENHAUL_BOT_SERVICE_KEY:-}
      OPENHAUL_VTC_API_KEY: ${OPENHAUL_VTC_API_KEY:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_FINE_CHANNEL_ID: ${DISCORD_FINE_CHANNEL_ID:-}
      DISCORD_JOB_CHANNEL_ID: ${DISCORD_JOB_CHANNEL_ID:-}
      DISCORD_DRIVER_CHANNEL_ID: ${DISCORD_DRIVER_CHANNEL_ID:-}
    depends_on:
      openhaul:
        condition: service_healthy
    profiles: ["bot"]

volumes:
  postgres-data:
  redis-data:
